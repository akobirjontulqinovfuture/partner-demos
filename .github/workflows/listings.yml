name: SmartBook listings
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: listings
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read public t.me/s/SmartBookN1 preview
        run: |
          cp .github/scripts/fetch-listings.mjs /tmp/fetch.mjs
          git fetch --depth=1 origin data:data 2>/dev/null && git show data:smartbook/listings.json > /tmp/listings.json 2>/dev/null || true
          node /tmp/fetch.mjs /tmp/listings.json
      - name: Commit to data branch (only when listings changed)
        run: |
          git config user.name "listings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify data >/dev/null 2>&1; then git checkout -q data; else git checkout -q --orphan data && git rm -rfq . ; fi
          mkdir -p smartbook && cp /tmp/listings.json smartbook/listings.json
          git add smartbook/listings.json
          if git diff --cached --quiet; then echo "no change"; else git commit -qm "listings: $(date -u +%FT%TZ)" && git push -q origin data; fi
